name: GAME Voice Ulduar R8
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ulduar-r8.yml'
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install edge-tts
      - run: |
          python - <<'PY'
          import asyncio,edge_tts,pathlib,json,hashlib
          d=pathlib.Path('output');d.mkdir()
          lines=json.loads('''{"mim_fire_hit":"脚下火焰，快躲！","mim_grounded":"磁力核心已生效，全力输出空中单位！","mim_airborne":"空中指挥单位重新升空！","mim_heat":"热浪，注意全团血量！","mim_bomb_hit":"炸弹机器人爆炸，注意躲避！"}''')
          async def main():
              rows=[]
              for k,v in lines.items():
                  p=d/(k+'.mp3')
                  for attempt in range(3):
                      try:
                          await asyncio.wait_for(edge_tts.Communicate(v,'zh-CN-XiaoxiaoNeural',rate='+15%',pitch='+0Hz').save(str(p)),timeout=25)
                          assert p.stat().st_size>1024
                          break
                      except Exception:
                          if attempt==2: raise
                          await asyncio.sleep(2)
                  rows.append({'id':k,'text':v,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
              (d/'manifest.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2))
          asyncio.run(main())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: GAME_Ulduar_R8
          path: output/
          retention-days: 7
